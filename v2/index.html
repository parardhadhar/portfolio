<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parardha Dhar — Field Notes / Software & Applied AI</title>
    <meta name="description" content="Explore Parardha Dhar’s field notes: software engineering, AI crystallography research at IISc Bangalore, full-stack products, and interactive worlds." />
    <meta name="author" content="Parardha Dhar" />
    <meta property="og:title" content="Parardha Dhar — A curious mind. A world of possibilities." />
    <meta property="og:description" content="A personal journey through software, scientific imaging, and things worth building. Step into Parardha’s Field Notes." />
    <meta property="og:image" content="https://parardha.vercel.app/field-valley.webp" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#151917" />
    <script>
      (() => {
        let theme = 'night';
        try { if (localStorage.getItem('field-theme') === 'day') theme = 'day'; } catch {}
        document.documentElement.dataset.fieldTheme = theme;
        const mobile = matchMedia('(max-width:600px)').matches ? '-mobile' : '';
        const preload = document.createElement('link');
        preload.rel = 'preload'; preload.as = 'image'; preload.fetchPriority = 'high';
        preload.href = '/media/valley-' + theme + mobile + '-v1.webp';
        document.head.append(preload);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
